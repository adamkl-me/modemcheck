name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  python-security:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        # Installed via pipx so each scanner lives in its own venv. Installing them
        # with plain `pip` puts their dependency trees in the same environment that
        # pip-audit then scans, producing findings for the scanners themselves and
        # for packages baked into the runner image (e.g. setuptools).
        run: |
          pipx install pip-audit
          pipx install bandit

      - name: Run pip-audit (vulnerability scanner)
        # -r requirements.txt audits the declared dependencies rather than whatever
        # happens to be installed in the ambient environment.
        run: |
          cd cloudserver
          pip-audit -r requirements.txt --desc --format json --output pip-audit-report.json || true
          pip-audit -r requirements.txt --desc

      # NOTE: the `safety check` step was removed. `safety check` has been deprecated
      # and unsupported since 2024-06-01, exits 64 on any finding, paywalls its
      # remediation output, and draws on the same advisory data as pip-audit above.

      - name: Run Bandit (security linter)
        run: |
          cd cloudserver
          bandit -c ../.bandit.yaml -r app/ -f json -o bandit-report.json || true
          bandit -c ../.bandit.yaml -r app/ -ll  # Only show medium/high severity

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            cloudserver/pip-audit-report.json
            cloudserver/bandit-report.json
          retention-days: 30

  secret-detection:
    name: Secret Detection Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files '\.venv/|node_modules/|\.git/|dist/|\.minisig$|\.env$'

      - name: Upload baseline if exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-baseline
          path: .secrets.baseline
          retention-days: 30
          if-no-files-found: ignore

  go-security:
    name: Go Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        # Driven by the `go` directive in go.mod rather than a hardcoded version, with
        # check-latest so the newest matching patch release (and therefore the newest
        # standard library) is used instead of a stale pinned toolchain.
        uses: actions/setup-go@v5
        with:
          go-version-file: modemcheck-client/go.mod
          check-latest: true
          cache-dependency-path: modemcheck-client/go.sum

      - name: Show Go version
        run: go version

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd modemcheck-client
          govulncheck ./...

      - name: Run gosec (security linter)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd modemcheck-client
          gosec -fmt json -out gosec-report.json ./... || true
          gosec ./...

      - name: Upload Go security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-security-reports
          path: |
            modemcheck-client/gosec-report.json
          retention-days: 30
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
