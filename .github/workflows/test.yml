name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go-tests:
    name: Go Client Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      # 'stable' tracks the newest stable Go release. The previous '1.24.x' pin was below
      # the module's own `go 1.25` requirement and shipped a stale standard library.
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Get dependencies
      run: |
        cd modemcheck-client
        go mod download

    - name: Run tests with coverage
      run: |
        cd modemcheck-client
        go test -v -race -coverprofile=coverage.txt -covermode=atomic .

    - name: Check coverage threshold
      run: |
        cd modemcheck-client
        coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${coverage}%"
        # Excludes scraper/ (hardware-dependent, no tests). Core logic at ~40%.
        if (( $(echo "${coverage} < 35" | bc -l) )); then
          echo "Coverage ${coverage}% is below threshold of 35%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./modemcheck-client/coverage.txt
        flags: go-client
        name: go-client-coverage

  python-tests:
    name: Python Server Tests (Full Suite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Install Python dependencies
      run: |
        cd cloudserver
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        playwright install chromium firefox webkit

    - name: Run full test suite with run_all_tests.sh
      run: |
        cd cloudserver
        # Set CI environment variable for test suite
        export CI=true
        chmod +x run_all_tests.sh
        ./run_all_tests.sh

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          cloudserver/htmlcov/
          cloudserver/coverage.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./cloudserver/coverage.xml
        flags: python-server
        name: python-server-coverage

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [go-tests, python-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      # 'stable' tracks the newest stable Go release, so release binaries are not built
      # against an outdated standard library.
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Build Go client
      run: |
        cd modemcheck-client
        go build -v .

    - name: Build Docker image
      run: |
        cd cloudserver
        docker build -t modemcheck-cloud:test .