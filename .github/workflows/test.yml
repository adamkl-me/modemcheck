name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  go-tests:
    name: Go Client Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Get dependencies
      run: |
        cd modemcheck-client
        go mod download

    - name: Run tests with coverage
      run: |
        cd modemcheck-client
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Check coverage threshold
      run: |
        cd modemcheck-client
        coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${coverage}%"
        if (( $(echo "${coverage} < 95" | bc -l) )); then
          echo "Coverage ${coverage}% is below threshold of 95%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./modemcheck-client/coverage.txt
        flags: go-client
        name: go-client-coverage

  python-tests:
    name: Python Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modemcheck
          POSTGRES_PASSWORD: modemcheck_test_password
          POSTGRES_DB: modemcheck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd cloudserver
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        playwright install chromium

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+asyncpg://modemcheck:modemcheck_test_password@localhost:5433/modemcheck_test
        REDIS_HOST: localhost
        REDIS_PORT: 6380
        SECRET_KEY: test-secret-key-for-ci
        CSRF_SECRET_KEY: test-csrf-secret-key-for-ci
        APP_ENV: test
        TESTING: "true"
      run: |
        cd cloudserver
        pytest -v --cov=app --cov-report=xml --cov-report=html --cov-report=term

    - name: Check coverage threshold
      run: |
        cd cloudserver
        coverage=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.get('line-rate')) * 100)")
        echo "Coverage: ${coverage}%"
        if (( $(echo "${coverage} < 95" | bc -l) )); then
          echo "Coverage ${coverage}% is below threshold of 95%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./cloudserver/coverage.xml
        flags: python-server
        name: python-server-coverage

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [go-tests, python-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Run Bandit (Python security)
      run: |
        pip install bandit
        cd cloudserver
        bandit -r app/ -f json -o bandit-report.json || true

    - name: Run gosec (Go security)
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        cd modemcheck-client
        gosec -fmt json -out gosec-report.json ./... || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          cloudserver/bandit-report.json
          modemcheck-client/gosec-report.json

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-tests, python-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Compose
      run: |
        cd cloudserver
        docker-compose -f docker-compose.test.yml up -d

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:22560/health; do sleep 2; done'

    - name: Run integration tests
      run: |
        cd cloudserver
        python -m pytest tests/e2e/ -v

    - name: Cleanup
      if: always()
      run: |
        cd cloudserver
        docker-compose -f docker-compose.test.yml down -v

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [go-tests, python-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Build Go client
      run: |
        cd modemcheck-client
        go build -v .

    - name: Build Docker image
      run: |
        cd cloudserver
        docker build -t modemcheck-cloud:test .