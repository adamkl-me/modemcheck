[pytest]
# Pytest configuration for ModemCheck Cloud v2

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --cov=app
    --cov-report=term-missing
    --cov-report=xml

# Warning filters - Selective suppression instead of blanket --disable-warnings
# Suppress dependency deprecation warnings (not actionable until dependencies update)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    # Show resource warnings (connection leaks, unclosed files)
    default::ResourceWarning
    # Ignore known Playwright warnings
    ignore:.*Playwright.*:DeprecationWarning
    # Ignore SQLAlchemy/asyncpg event loop warnings in test mode
    ignore:.*Event loop.*:RuntimeWarning
    ignore:.*loop.*:DeprecationWarning

# Asyncio configuration
asyncio_mode = auto

# Markers
markers =
    api: API endpoint tests
    ui: UI/Playwright tests
    security: Security vulnerability tests
    rbac: Role-based access control tests
    slow: Slow-running tests
    integration: Integration tests requiring full stack
    performance: Performance and load testing
    unit: Unit tests

# Test timeouts
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    # E2E-tested code (tested via HTTP integration tests, not unit tests)
    app/routers/*
    app/middleware/*
    app/main.py
# Enable dynamic contexts to track which tests execute which lines
dynamic_context = test_function

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
# Show which tests executed each line in HTML report
show_contexts = true
