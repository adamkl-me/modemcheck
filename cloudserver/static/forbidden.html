<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
    <title>Access Denied - ModemCheck Cloud</title>
    <!-- Blocking script to prevent FOUC -->
    <script>
        (function() {
            var theme = localStorage.getItem('modemcheck-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* Light Theme (Classic Aero Blue) */
        :root, [data-theme="light"] {
            --primary: #0078D4;
            --primary-hover: #106EBE;
            --accent: #00B4D8;
            --glass-tint: rgba(232, 244, 252, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: rgba(0, 120, 212, 0.1);
            --surface: #F8FAFC;
            --surface-elevated: rgba(255, 255, 255, 0.85);
            --bg: #F8FAFC;
            --bg-gradient: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 50%, #E0F2FE 100%);
            --text: #1E293B;
            --text-muted: #64748B;
            --success: #14B8A6;
            --warning: #F59E0B;
            --error: #F43F5E;
            --border-color: #E2E8F0;
        }

        /* Dark Theme (Dark Instrument Panel) - Default */
        [data-theme="dark"] {
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --accent: #22D3EE;
            --glass-tint: rgba(30, 58, 95, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: rgba(59, 130, 246, 0.2);
            --surface: #1F2937;
            --surface-elevated: rgba(31, 41, 55, 0.9);
            --bg: #111827;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            --text: #E2E8F0;
            --text-muted: #94A3B8;
            --success: #22C55E;
            --warning: #FB923C;
            --error: #F87171;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass-tint);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
            box-shadow:
                0 4px 6px -1px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 12px -2px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        [data-theme="light"] .theme-icon-light { display: none; }
        [data-theme="light"] .theme-icon-dark { display: inline; }
        [data-theme="dark"] .theme-icon-light { display: inline; }
        [data-theme="dark"] .theme-icon-dark { display: none; }

        .error-container {
            background: var(--glass-tint);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* Fallback for browsers without backdrop-filter */
        @supports not (backdrop-filter: blur(16px)) {
            .error-container {
                background: var(--surface-elevated);
            }
            .theme-toggle {
                background: var(--surface);
            }
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px var(--glass-shadow));
        }

        h1 {
            color: var(--error);
            font-size: 2em;
            margin-bottom: 16px;
            text-shadow: 0 2px 4px var(--glass-shadow);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 4px 12px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.15), transparent);
            pointer-events: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 20px var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .help-text {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .error-container {
                padding: 40px 24px;
            }

            .error-icon {
                font-size: 60px;
            }

            h1 {
                font-size: 1.5em;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                padding: 8px 12px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span class="theme-icon-light">&#9728;</span>
        <span class="theme-icon-dark">&#9790;</span>
    </button>

    <div class="error-container">
        <div class="error-icon">&#128683;</div>
        <h1>Access Denied</h1>
        <p>You don't have permission to access this page. This area is restricted to users with elevated or administrator privileges.</p>
        <a href="/viewer" class="btn">Return to Viewer Dashboard</a>
        <div class="help-text">
            If you believe you should have access to this page, please contact your administrator.
        </div>
    </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('modemcheck-theme', next);
        }
    </script>
</body>
</html>
