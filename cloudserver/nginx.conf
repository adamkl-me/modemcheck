# API endpoint on port 22557 (for uploads only)
server {
    listen 22557;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Only allow CGI-BIN (API endpoints)
    location /cgi-bin/ {
        gzip off;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
    }

    # Deny all other requests
    location / {
        return 404;
    }
}

# Viewer interface on port 23890
server {
    listen 23890;
    server_name _;

    root /modemcheck-cloud;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main site
    location / {
        try_files $uri $uri/ =404;
    }

    # JavaScript files - no cache during development, or short cache in production
    location ~ \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # CGI-BIN for API (read-only endpoints for viewer, except auth.py for login/logout/password change)
    location /cgi-bin/auth.py {
        gzip off;

        # CORS headers - allow POST for login/logout/password change
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
    }

    # Other CGI endpoints (read-only)
    location /cgi-bin/ {
        gzip off;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
    }
}

# Admin dashboard on port 23891
server {
    listen 23891;
    server_name _;

    root /modemcheck-cloud;
    index admin-login.html admin.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main admin page
    location / {
        try_files $uri $uri/ =404;
    }

    # JavaScript files - no cache during development, or short cache in production
    location ~ \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # CGI-BIN for Admin API
    location /cgi-bin/ {
        gzip off;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
    }
}
