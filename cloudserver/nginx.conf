# Real IP configuration for proxies (Cloudflare, local reverse proxy)
set_real_ip_from 172.25.0.0/16;  # Docker network
set_real_ip_from 10.0.0.0/8;      # Private networks
set_real_ip_from 192.168.0.0/16;  # Private networks
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Gzip compression configuration
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";
gzip_min_length 256;

# Static asset caching
open_file_cache max=1000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/s;

# API endpoint on port 22557 (for uploads only)
server {
    listen 22557;
    http2 on;
    server_name _;

    # Client body size limit
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: Uncomment if TLS is terminated at nginx (not needed for Cloudflare Tunnel)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Only allow CGI-BIN (API endpoints)
    location /cgi-bin/ {
        # Rate limiting for uploads
        limit_req zone=upload_limit burst=20 nodelay;
        limit_req_status 429;

        # Remove CORS - not needed for upload API
        # Clients should connect directly, not from browsers

        # Only allow POST
        limit_except POST OPTIONS {
            deny all;
        }

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Deny all other requests
    location / {
        return 404;
    }
}

# Viewer interface on port 23890
server {
    listen 23890;
    http2 on;
    server_name _;

    root /modemcheck-cloud;
    index index.html;

    # Client limits
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self';" always;

    # Static assets with long-term caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JavaScript and CSS files with moderate caching
    location ~ \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # HTML files - no cache
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Main site (database mode only)
    location / {
        try_files $uri $uri/ =404;
    }

    # CGI-BIN for auth (login/logout/password change)
    location /cgi-bin/auth.py {
        # Rate limiting for authentication
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        # Remove CORS - same-origin only
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Other CGI endpoints (authenticated API)
    location /cgi-bin/ {
        # Rate limiting for API requests (optimized for single-request loads)
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        # Remove CORS - same-origin only

        # Only allow GET (authentication enforced in Python)
        limit_except GET OPTIONS {
            deny all;
        }

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
}

# Admin dashboard on port 23891
server {
    listen 23891;
    http2 on;
    server_name _;

    root /modemcheck-cloud;
    index admin-login.html admin.html;

    # Client limits (increased for bulk upload)
    client_max_body_size 50m;
    client_body_buffer_size 512k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: Uncomment if TLS is terminated at nginx (not needed for Cloudflare Tunnel)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; connect-src 'self';" always;

    # Static assets with long-term caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JavaScript and CSS files with moderate caching
    location ~ \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # HTML files - no cache
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Main admin page
    location / {
        try_files $uri $uri/ =404;
    }

    # CGI-BIN for auth (login/logout/password change)
    location /cgi-bin/auth.py {
        # Rate limiting for authentication
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # CGI-BIN for data management API (needs POST for upload/delete)
    location /cgi-bin/data-management-api.py {
        # Rate limiting for data operations
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        # Allow GET and POST for data management operations
        limit_except GET POST OPTIONS {
            deny all;
        }

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # CGI-BIN for Admin API (authenticated) - allow POST for form submissions
    location /cgi-bin/ {
        # Rate limiting for admin API (optimized for single-request loads)
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        # Remove CORS - same-origin only for admin

        # Allow GET and POST for admin operations
        limit_except GET POST OPTIONS {
            deny all;
        }

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /modemcheck-cloud$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
}
