name: modemcheck-test

services:
  redis-test:
    container_name: modemcheck-redis-test
    image: redis:7-alpine
    # Use password authentication to match production setup
    # WARNING: This is a test-only password - never use in production!
    command: redis-server --requirepass modemcheck_redis_test_only --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=America/Toronto
    ports:
      - "6380:6379"  # Expose Redis on port 6380 to avoid conflicts with local Redis
    volumes:
      - modemcheck-test_redis:/data
    networks:
      - modemcheck-test
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "modemcheck_redis_test_only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres-test:
    container_name: modemcheck-postgres-test
    image: postgres:16-alpine
    command: postgres -c max_connections=200
    ports:
      - "5433:5432"  # Expose PostgreSQL on port 5433 to avoid conflicts with local PostgreSQL
    environment:
      - TZ=America/Toronto
      - POSTGRES_USER=modemcheck
      - POSTGRES_PASSWORD=modemcheck_test_password
      - POSTGRES_DB=modemcheck_test
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - modemcheck-test_postgres:/var/lib/postgresql/data
    networks:
      - modemcheck-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modemcheck"]
      interval: 5s
      timeout: 3s
      retries: 5

  modemcheck-cloud-test:
    container_name: modemcheck-cloud-test
    image: modemcheck-cloud:test
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "22560:8000"  # Upload API (test port)
      - "23894:8000"  # Web UI (test port)
    environment:
      # System
      - TZ=America/Toronto
      # Database
      - DATABASE_URL=postgresql+asyncpg://modemcheck:modemcheck_test_password@postgres-test:5432/modemcheck_test
      # Redis
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_PASSWORD=modemcheck_redis_test_only
      # Application
      - APP_ENV=test
      - DEBUG=true
      - SECRET_KEY=test-secret-key-not-for-production
      - SESSION_TTL=3600
      - CSRF_SECRET_KEY=test-csrf-secret-key
      # CORS
      - ALLOWED_ORIGINS=*
      # Workers
      - WORKERS=2
      # Test-specific settings
      - MAX_UPLOAD_SIZE=52428800
      - MAX_BULK_UPLOAD_FILES=100
    networks:
      - modemcheck-test
    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  modemcheck-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
          gateway: 172.27.0.1

volumes:
  modemcheck-test_postgres:
    name: modemcheck-test_postgres
  modemcheck-test_redis:
    name: modemcheck-test_redis
