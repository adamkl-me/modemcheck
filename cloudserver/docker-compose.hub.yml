# Pull-based compose for use when running from Docker Hub.
# Requires a .env file with: POSTGRES_DB_PASSWORD, REDIS_PASSWORD, SECRET_KEY,
# CSRF_SECRET_KEY, ALLOWED_ORIGINS. See .env.example for details.
#
# Usage:
#   docker compose -f docker-compose.hub.yml up -d

name: modemcheck

services:
  redis:
    container_name: modemcheck-redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=America/Toronto
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - modemcheck_redis:/data
    restart: unless-stopped
    networks:
      - modemcheck
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  postgres:
    container_name: modemcheck-postgres
    image: postgres:16-alpine
    command: postgres -c max_connections=200
    environment:
      - TZ=America/Toronto
      - POSTGRES_USER=modemcheck
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=modemcheck
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - modemcheck_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - modemcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modemcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  modemcheck-cloud:
    container_name: modemcheck-cloud
    image: ${DOCKERHUB_USERNAME:-adamkl}/modemcheck-cloud:latest
    ports:
      - "22557:8000"  # Upload API
      - "23890:8000"  # Web UI
    environment:
      # System
      - TZ=America/Toronto
      # Database
      - DATABASE_URL=postgresql+asyncpg://modemcheck:${POSTGRES_DB_PASSWORD}@postgres:5432/modemcheck
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Application
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TTL=3600
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Workers
      - WORKERS=4
    restart: unless-stopped
    networks:
      - modemcheck
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  modemcheck:
    driver: bridge

volumes:
  modemcheck_postgres:
    name: modemcheck_postgres
  modemcheck_redis:
    name: modemcheck_redis
