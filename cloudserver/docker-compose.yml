name: modemcheck

services:
  redis:
    container_name: modemcheck-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=America/Toronto
    volumes:
      - modemcheck_redis:/data
    restart: unless-stopped
    networks:
      - modemcheck
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  postgres:
    container_name: modemcheck-postgres
    image: postgres:16-alpine
    environment:
      - TZ=America/Toronto
      - POSTGRES_USER=modemcheck
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=modemcheck
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - modemcheck_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - modemcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modemcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  modemcheck-cloud:
    container_name: modemcheck-cloud
    image: modemcheck-cloud:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "22557:8000"  # Upload API (keeping original port for backward compatibility)
      - "23890:8000"  # Web UI (unified login + viewer + admin dashboards)
    environment:
      # System
      - TZ=America/Toronto
      # Database
      - DATABASE_URL=postgresql+asyncpg://modemcheck:${POSTGRES_DB_PASSWORD}@postgres:5432/modemcheck
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Application
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TTL=3600
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Workers
      - WORKERS=4
    restart: unless-stopped
    networks:
      - modemcheck
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  modemcheck:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

volumes:
  modemcheck_postgres:
    name: modemcheck_postgres
  modemcheck_redis:
    name: modemcheck_redis
