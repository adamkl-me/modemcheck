name: modemcheck

services:
  redis:
    container_name: modemcheck-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - modemcheck-cloud_redis:/data
    restart: unless-stopped
    networks:
      - modemcheck
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  modemcheck-cloud:
    container_name: modemcheck-cloud
    image: modemcheck-cloud:latest
    build: .
    ports:
      - "22557:22557"  # Upload API
      - "23890:23890"  # Web UI (Viewer)
      - "23891:23891"  # Admin Dashboard
    volumes:
      - modemcheck-cloud_config:/modemcheck-cloud/config
      - modemcheck-cloud_db:/modemcheck-cloud/data
    restart: unless-stopped
    networks:
      - modemcheck
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  modemcheck:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

volumes:
  modemcheck-cloud_config:
    external: true
    name: modemcheck-cloud_config
  modemcheck-cloud_db:
    external: true
    name: modemcheck-cloud_db
  modemcheck-cloud_redis:
    external: true
    name: modemcheck-cloud_redis
