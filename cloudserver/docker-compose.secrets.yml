# Docker Compose override for Docker Secrets (production only)
#
# This file demonstrates how to use Docker Secrets instead of environment variables
# for enhanced security in production environments.
#
# Usage:
#   1. Initialize Docker Swarm: docker swarm init
#   2. Create secrets (see DOCKER_SECRETS.md)
#   3. Deploy: docker stack deploy -c docker-compose.yml -c docker-compose.secrets.yml modemcheck
#
# Note: This requires Docker Swarm mode, which is overkill for development.
#       Only use in production environments with sensitive data.

version: '3.8'

services:
  postgres:
    secrets:
      - postgres_password
    environment:
      # PostgreSQL reads password from file when POSTGRES_PASSWORD_FILE is set
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Remove direct POSTGRES_PASSWORD variable

  modemcheck-api:
    secrets:
      - postgres_password
      - app_secret_key
      - csrf_secret_key
      - redis_password
    environment:
      # Application will read secrets from these file paths
      # Requires code changes to support _FILE suffix (see DOCKER_SECRETS.md)
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SECRET_KEY_FILE: /run/secrets/app_secret_key
      CSRF_SECRET_KEY_FILE: /run/secrets/csrf_secret_key
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # Keep non-sensitive env vars as-is
      # DATABASE_URL, APP_ENV, etc.

  redis:
    secrets:
      - redis_password
    # Override command to read password from secret file
    command: >
      sh -c '
      PASSWORD=$$(cat /run/secrets/redis_password);
      redis-server
      --requirepass $$PASSWORD
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      '

  nginx:
    # nginx doesn't need secrets (proxies requests only)
    # No changes required

# Define secrets (must be created externally via docker secret create)
secrets:
  postgres_password:
    external: true
    name: postgres_password

  app_secret_key:
    external: true
    name: app_secret_key

  csrf_secret_key:
    external: true
    name: csrf_secret_key

  redis_password:
    external: true
    name: redis_password
